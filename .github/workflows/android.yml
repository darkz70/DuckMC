# DuckMC — автосборка Android APK на GitHub Actions.
#
# Настройка (один раз):
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  VITE_MS_CLIENT_ID
#     Value: ваш Azure Application (client) ID
#   Секрет скрыт в логах и не попадает в репозиторий — он только вшивается
#   в собираемый APK.
#
# Запуск: автоматически при каждом пуше, либо Actions → Run workflow.
# Готовый файл: артефакт DuckMC-debug-apk на странице запуска.

name: DuckMC Android APK

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: JDK 21 (требование Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка зависимостей
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Вшиваем client_id из секрета
        working-directory: app
        env:
          VITE_MS_CLIENT_ID: ${{ secrets.VITE_MS_CLIENT_ID }}
        run: |
          if [ -n "$VITE_MS_CLIENT_ID" ]; then
            printf 'VITE_MS_CLIENT_ID=%s\n' "$VITE_MS_CLIENT_ID" > .env
            echo "client_id вшит в сборку (длина: ${#VITE_MS_CLIENT_ID} символов)"
          else
            echo "Секрет VITE_MS_CLIENT_ID не задан — вход Microsoft попросит ввести ID вручную"
          fi

      - name: Сборка веб-части
        working-directory: app
        run: npm run build

      - name: Синхронизация Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Сборка APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Выкладываем APK
        uses: actions/upload-artifact@v4
        with:
          name: DuckMC-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
